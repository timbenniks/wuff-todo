name: Contributor delivery and safety
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: contributor-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NEVER check out a PR head, run its code or install its dependencies here.
      # This privileged job reads metadata only and executes policy from main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/contributor-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
